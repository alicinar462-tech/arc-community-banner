<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Arc Community Banner — Customize</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap');

  :root {
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  body {
    margin: 0;
    background: #f5f6f8;
    color: #18233b;
  }

  .wrap {
    max-width: 1180px;
    margin: 32px auto;
    padding: 0 20px 40px;
  }

  h1 {
    margin: 0 0 6px;
    font-size: 28px;
    font-weight: 800;
  }

  p {
    margin: 0 0 22px;
    color: #59647a;
  }

  .grid {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 24px;
    align-items: start;
  }

  .panel {
    background: #fff;
    border: 1px solid #dfe4ec;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 8px 28px rgba(20,35,60,.06);
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .05em;
    margin: 14px 0 6px;
  }

  input,
  select {
    width: 100%;
    box-sizing: border-box;
    padding: 11px 12px;
    border: 1px solid #cbd3df;
    border-radius: 9px;
    font-family: Inter, sans-serif;
    font-size: 14px;
    background: #fff;
    color: #18233b;
  }

  button {
    width: 100%;
    margin-top: 18px;
    border: 0;
    border-radius: 9px;
    padding: 12px;
    font-family: Inter, sans-serif;
    font-weight: 800;
    cursor: pointer;
  }

  #download {
    background: #172b55;
    color: #fff;
  }

  #reset {
    background: #edf1f6;
    color: #24324d;
  }

  canvas {
    width: 100%;
    height: auto;
    display: block;
    background: #fff;
    border-radius: 10px;
    border: 1px solid #dfe4ec;
  }

  .hint {
    font-size: 12px;
    line-height: 1.5;
    margin-top: 14px;
    color: #6a7486;
  }

  @media(max-width:850px) {
    .grid {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>

<body>

<div class="wrap">

  <h1>Arc Community Banner</h1>

  <p>
    Fork the repository, personalize your profile information,
    choose your country flag, then download your 1500 × 500 X/Twitter banner.
  </p>

  <div class="grid">

    <section class="panel">

      <input

        value="YOUR NAME"
        maxlength="32"
      >

      <input

      >

      <label for="location">LOCATION</label>
      <input
        id="location"

        maxlength="28"
      >

      <label for="chapter">CHAPTER</label>
      <input
        id="chapter"
        value="YOUR CHAPTER"
        maxlength="28"
      >

      <label for="country">COUNTRY FLAG</label>

      <select id="country">

        <option value="TR">🇹🇷 Turkey</option>
        <option value="US">🇺🇸 United States</option>
        <option value="GB">🇬🇧 United Kingdom</option>
        <option value="DE">🇩🇪 Germany</option>
        <option value="FR">🇫🇷 France</option>
        <option value="IT">🇮🇹 Italy</option>
        <option value="ES">🇪🇸 Spain</option>
        <option value="PT">🇵🇹 Portugal</option>
        <option value="NL">🇳🇱 Netherlands</option>
        <option value="BE">🇧🇪 Belgium</option>
        <option value="CH">🇨🇭 Switzerland</option>
        <option value="AT">🇦🇹 Austria</option>
        <option value="SE">🇸🇪 Sweden</option>
        <option value="NO">🇳🇴 Norway</option>
        <option value="DK">🇩🇰 Denmark</option>
        <option value="FI">🇫🇮 Finland</option>
        <option value="PL">🇵🇱 Poland</option>
        <option value="GR">🇬🇷 Greece</option>
        <option value="RO">🇷🇴 Romania</option>
        <option value="BG">🇧🇬 Bulgaria</option>
        <option value="UA">🇺🇦 Ukraine</option>
        <option value="RU">🇷🇺 Russia</option>
        <option value="AE">🇦🇪 United Arab Emirates</option>
        <option value="SA">🇸🇦 Saudi Arabia</option>
        <option value="IL">🇮🇱 Israel</option>
        <option value="IN">🇮🇳 India</option>
        <option value="PK">🇵🇰 Pakistan</option>
        <option value="BD">🇧🇩 Bangladesh</option>
        <option value="CN">🇨🇳 China</option>
        <option value="JP">🇯🇵 Japan</option>
        <option value="KR">🇰🇷 South Korea</option>
        <option value="SG">🇸🇬 Singapore</option>
        <option value="ID">🇮🇩 Indonesia</option>
        <option value="MY">🇲🇾 Malaysia</option>
        <option value="TH">🇹🇭 Thailand</option>
        <option value="VN">🇻🇳 Vietnam</option>
        <option value="PH">🇵🇭 Philippines</option>
        <option value="AU">🇦🇺 Australia</option>
        <option value="NZ">🇳🇿 New Zealand</option>
        <option value="BR">🇧🇷 Brazil</option>
        <option value="AR">🇦🇷 Argentina</option>
        <option value="MX">🇲🇽 Mexico</option>
        <option value="CA">🇨🇦 Canada</option>

      </select>

      <button id="download">
        DOWNLOAD 1500 × 500 PNG
      </button>

      <button id="reset">
        RESET
      </button>

      <div class="hint">
        Your personal information is rendered directly onto the banner.
        The country selection is used only to display the flag next to your chapter.
      </div>

    </section>

    <section class="panel">

      <canvas
        id="canvas"
        width="1500"
        height="500"
      ></canvas>

    </section>

  </div>

</div>

<script>

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const img = new Image();

img.src = 'assets/banner-base.png';

const fields = [
  'name',
  'username',
  'location',
  'chapter',
  'country'
];

const defaults = {
  name: 'YOUR NAME',
  username: '@YOUR_USERNAME',
  location: 'YOUR CITY',
  chapter: 'YOUR CHAPTER',
  country: 'TR'
};


/* -------------------------------------------------------
   FONT
------------------------------------------------------- */

const FONT_FAMILY =
  'Inter, "Segoe UI", system-ui, sans-serif';


/* -------------------------------------------------------
   FLAG COLORS
------------------------------------------------------- */

const FLAGS = {

  TR: [
    '#E30A17',
    '#FFFFFF'
  ],

  US: [
    '#B22234',
    '#FFFFFF',
    '#3C3B6E'
  ],

  GB: [
    '#012169',
    '#FFFFFF',
    '#C8102E'
  ],

  DE: [
    '#000000',
    '#DD0000',
    '#FFCE00'
  ],

  FR: [
    '#0055A4',
    '#FFFFFF',
    '#EF4135'
  ],

  IT: [
    '#009246',
    '#FFFFFF',
    '#CE2B37'
  ],

  ES: [
    '#AA151B',
    '#F1BF00',
    '#AA151B'
  ],

  NL: [
    '#AE1C28',
    '#FFFFFF',
    '#21468B'
  ],

  BE: [
    '#000000',
    '#FAE042',
    '#ED2939'
  ],

  CH: [
    '#D52B1E',
    '#FFFFFF'
  ],

  AT: [
    '#ED2939',
    '#FFFFFF',
    '#ED2939'
  ],

  SE: [
    '#006AA7',
    '#FECC00'
  ],

  NO: [
    '#BA0C2F',
    '#FFFFFF',
    '#00205B'
  ],

  DK: [
    '#C60C30',
    '#FFFFFF'
  ],

  FI: [
    '#FFFFFF',
    '#003580'
  ],

  PL: [
    '#FFFFFF',
    '#DC143C'
  ],

  GR: [
    '#0D5EAF',
    '#FFFFFF'
  ],

  RO: [
    '#002B7F',
    '#FCD116',
    '#CE1126'
  ],

  BG: [
    '#FFFFFF',
    '#00966E',
    '#D62612'
  ],

  UA: [
    '#0057B7',
    '#FFD700'
  ],

  RU: [
    '#FFFFFF',
    '#0039A6',
    '#D52B1E'
  ],

  AE: [
    '#00732F',
    '#FFFFFF',
    '#000000',
    '#FF0000'
  ],

  SA: [
    '#006C35',
    '#FFFFFF'
  ],

  IL: [
    '#FFFFFF',
    '#0038B8'
  ],

  IN: [
    '#FF9933',
    '#FFFFFF',
    '#138808'
  ],

  CN: [
    '#DE2910',
    '#FFDE00'
  ],

  JP: [
    '#FFFFFF',
    '#BC002D'
  ],

  KR: [
    '#FFFFFF',
    '#CD2E3A',
    '#0F64CD'
  ],

  SG: [
    '#EF3340',
    '#FFFFFF'
  ],

  ID: [
    '#CE1126',
    '#FFFFFF'
  ],

  MY: [
    '#CC0001',
    '#FFFFFF',
    '#010066'
  ],

  TH: [
    '#A51931',
    '#FFFFFF',
    '#2D2A4A'
  ],

  VN: [
    '#DA251D',
    '#FFFF00'
  ],

  PH: [
    '#0038A8',
    '#CE1126',
    '#FFFFFF'
  ],

  AU: [
    '#00008B',
    '#FFFFFF'
  ],

  NZ: [
    '#00247D',
    '#FFFFFF',
    '#CC142B'
  ],

  BR: [
    '#009C3B',
    '#FFDF00',
    '#002776'
  ],

  AR: [
    '#74ACDF',
    '#FFFFFF'
  ],

  MX: [
    '#006847',
    '#FFFFFF',
    '#CE1126'
  ],

  CA: [
    '#FF0000',
    '#FFFFFF'
  ]

};


/* -------------------------------------------------------
   FLAG DRAWING
------------------------------------------------------- */

function drawFlag(code, x, y, width = 30, height = 20) {

  const colors = FLAGS[code] || ['#182b54', '#ffffff'];

  ctx.save();

  /*
   * Rounded flag container
   */
  ctx.beginPath();

  const radius = 3;

  ctx.roundRect(
    x,
    y,
    width,
    height,
    radius
  );

  ctx.clip();

  /*
   * Most flags are represented using horizontal
   * color bands. This keeps the PNG self-contained.
   */
  const bandHeight = height / colors.length;

  colors.forEach((color, index) => {

    ctx.fillStyle = color;

    ctx.fillRect(
      x,
      y + index * bandHeight,
      width,
      bandHeight + 1
    );

  });

  /*
   * Special vertical flags
   */

  if (
    ['FR','IT','BE','RO','MX'].includes(code)
  ) {

    ctx.clearRect(x, y, width, height);

    const bandWidth = width / 3;

    colors.slice(0,3).forEach((color,index) => {

      ctx.fillStyle = color;

      ctx.fillRect(
        x + index * bandWidth,
        y,
        bandWidth + 1,
        height
      );

    });

  }

  /*
   * Simple Japanese / Korean / Turkish markers
   */

  if (code === 'JP') {

    ctx.fillStyle = '#BC002D';

    ctx.beginPath();

    ctx.arc(
      x + width / 2,
      y + height / 2,
      height * .28,
      0,
      Math.PI * 2
    );

    ctx.fill();

  }

  if (code === 'TR') {

    ctx.fillStyle = '#FFFFFF';

    ctx.beginPath();

    ctx.arc(
      x + width * .43,
      y + height / 2,
      height * .27,
      0,
      Math.PI * 2
    );

    ctx.fill();

    ctx.fillStyle = '#E30A17';

    ctx.beginPath();

    ctx.arc(
      x + width * .49,
      y + height / 2,
      height * .21,
      0,
      Math.PI * 2
    );

    ctx.fill();

    /*
     * Crescent tip
     */

    ctx.fillStyle = '#FFFFFF';

    ctx.beginPath();

    ctx.moveTo(
      x + width * .66,
      y + height * .5
    );

    ctx.lineTo(
      x + width * .53,
      y + height * .36
    );

    ctx.lineTo(
      x + width * .53,
      y + height * .64
    );

    ctx.closePath();

    ctx.fill();

  }

  ctx.restore();

}


/* -------------------------------------------------------
   TEXT FITTING
------------------------------------------------------- */

function fitFont(
  text,
  maxWidth,
  startSize = 14,
  minSize = 8
) {

  let size = startSize;

  while (size > minSize) {

    ctx.font =
      `700 ${size}px ${FONT_FAMILY}`;

    if (
      ctx.measureText(text).width <= maxWidth
    ) {

      return size;

    }

    size -= 0.5;

  }

  return minSize;

}


/* -------------------------------------------------------
   CENTERED TEXT
------------------------------------------------------- */

function drawCenteredText(
  text,
  x,
  y,
  width,
  startSize = 14,
  minSize = 8
) {

  const size = fitFont(
    text,
    width,
    startSize,
    minSize
  );

  ctx.font =
    `700 ${size}px ${FONT_FAMILY}`;

  ctx.fillStyle = '#182b54';

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.fillText(
    text,
    x + width / 2,
    y
  );

}


/* -------------------------------------------------------
   MAIN DRAW
------------------------------------------------------- */

function draw() {

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  /*
   * Background banner
   */

  if (img.complete) {

    ctx.drawImage(
      img,
      0,
      0,
      canvas.width,
      canvas.height
    );

  }


  /*
   * RIGHT-SIDE PROFILE BOXES
   *
   * These coordinates are intentionally inside
   * the empty value area of the new artwork.
   */

  const slots = {

    name: {
      x: 1235,
      y: 394,
      width: 225
    },

    username: {
      x: 1235,
      y: 454,
      width: 225
    },

    location: {
      x: 1235,
      y: 523,
      width: 225
    },

    chapter: {
      x: 1235,
      y: 595,
      width: 225
    }

  };


  /*
   * Values
   */

  const name =
    document.getElementById('name').value.trim()
    || defaults.name;

  const username =
    document.getElementById('username').value.trim()
    || defaults.username;

  const location =
    document.getElementById('location').value.trim()
    || defaults.location;

  const chapter =
    document.getElementById('chapter').value.trim()
    || defaults.chapter;

  const country =
    document.getElementById('country').value
    || defaults.country;


  /*
   * Render profile values
   */

  drawCenteredText(
    name,
    slots.name.x,
    slots.name.y,
    slots.name.width,
    16,
    9
  );


  drawCenteredText(
    username,
    slots.username.x,
    slots.username.y,
    slots.username.width,
    15,
    9
  );


  drawCenteredText(
    location,
    slots.location.x,
    slots.location.y,
    slots.location.width,
    15,
    9
  );


  /*
   * CHAPTER
   *
   * Text + country flag
   */

  const chapterFontSize =
    fitFont(
      chapter,
      180,
      15,
      9
    );

  ctx.font =
    `700 ${chapterFontSize}px ${FONT_FAMILY}`;

  const chapterWidth =
    ctx.measureText(chapter).width;

  const flagWidth = 30;
  const gap = 9;

  const totalWidth =
    chapterWidth +
    gap +
    flagWidth;


  /*
   * Center chapter + flag as a group
   */

  const startX =
    slots.chapter.x +
    (slots.chapter.width - totalWidth) / 2;


  ctx.fillStyle = '#182b54';

  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';

  ctx.fillText(
    chapter,
    startX,
    slots.chapter.y
  );


  drawFlag(
    country,
    startX + chapterWidth + gap,
    slots.chapter.y - 10,
    30,
    20
  );

}


/* -------------------------------------------------------
   EVENTS
------------------------------------------------------- */

img.onload = draw;

fields.forEach(id => {

  document
    .getElementById(id)
    .addEventListener(
      'input',
      draw
    );

  document
    .getElementById(id)
    .addEventListener(
      'change',
      draw
    );

});


/* -------------------------------------------------------
   DOWNLOAD
------------------------------------------------------- */

document
  .getElementById('download')
  .addEventListener('click', () => {

    const a =
      document.createElement('a');

    a.download =
      'arc-community-banner-1500x500.png';

    a.href =
      canvas.toDataURL('image/png');

    a.click();

  });


/* -------------------------------------------------------
   RESET
------------------------------------------------------- */

document
  .getElementById('reset')
  .addEventListener('click', () => {

    document
      .getElementById('name')
      .value = defaults.name;

    document
      .getElementById('username')
      .value = defaults.username;

    document
      .getElementById('location')
      .value = defaults.location;

    document
      .getElementById('chapter')
      .value = defaults.chapter;

    document
      .getElementById('country')
      .value = defaults.country;

    draw();

  });

</script>

</body>
</html>

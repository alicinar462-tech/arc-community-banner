<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Arc Community Banner — Customize</title>

<style>
  :root {
    font-family:
      Inter,
      ui-sans-serif,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: #f5f6f8;
    color: #18233b;
  }

  .wrap {
    max-width: 1180px;
    margin: 32px auto;
    padding: 0 20px 40px;
  }

  h1 {
    margin: 0 0 6px;
    font-size: 28px;
    font-weight: 800;
  }

  p {
    margin: 0 0 22px;
    color: #59647a;
  }

  .grid {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 24px;
    align-items: start;
  }

  .panel {
    background: #fff;
    border: 1px solid #dfe4ec;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 8px 28px rgba(20,35,60,.06);
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .05em;
    margin: 14px 0 6px;
  }

  input,
  select {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid #cbd3df;
    border-radius: 9px;
    font-size: 14px;
    font-family: inherit;
    background: #fff;
    color: #18233b;
  }

  button {
    width: 100%;
    margin-top: 18px;
    border: 0;
    border-radius: 9px;
    padding: 12px;
    font-weight: 800;
    cursor: pointer;
    font-family: inherit;
  }

  #download {
    background: #172b55;
    color: #fff;
  }

  #download:disabled {
    opacity: .6;
    cursor: wait;
  }

  #reset {
    background: #edf1f6;
    color: #24324d;
  }

  canvas {
    width: 100%;
    height: auto;
    display: block;
    background: white;
    border-radius: 10px;
    border: 1px solid #dfe4ec;
  }

  .hint {
    font-size: 12px;
    line-height: 1.5;
    margin-top: 14px;
    color: #6a7486;
  }

  @media(max-width:850px) {
    .grid {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>

<body>

<div class="wrap">

  <h1>Arc Community Banner</h1>

  <p>
    Fork the repository, personalize your fields, then download your
    1500 × 500 X/Twitter banner.
  </p>

  <div class="grid">

    <section class="panel">

      <label for="name">NAME</label>
      <input
        id="name"
        type="text"
        value="YOUR NAME"
        autocomplete="off"
      >

      <label for="username">USERNAME</label>
      <input
        id="username"
        type="text"
        value="@YOUR_USERNAME"
        autocomplete="off"
      >

      <label for="location">LOCATION</label>
      <input
        id="location"
        type="text"
        value="YOUR CITY"
        autocomplete="off"
      >

      <label for="chapter">CHAPTER</label>
      <input
        id="chapter"
        type="text"
        value="YOUR CHAPTER"
        autocomplete="off"
      >

      <label for="country">COUNTRY FLAG</label>

      <select id="country">

        <option value="">No flag</option>

        <option value="TR">Türkiye</option>
        <option value="US">United States</option>
        <option value="GB">United Kingdom</option>
        <option value="DE">Germany</option>
        <option value="FR">France</option>
        <option value="IT">Italy</option>
        <option value="ES">Spain</option>
        <option value="PT">Portugal</option>
        <option value="NL">Netherlands</option>
        <option value="BE">Belgium</option>
        <option value="CH">Switzerland</option>
        <option value="AT">Austria</option>

        <option value="SE">Sweden</option>
        <option value="NO">Norway</option>
        <option value="DK">Denmark</option>
        <option value="FI">Finland</option>

        <option value="PL">Poland</option>
        <option value="CZ">Czechia</option>
        <option value="GR">Greece</option>
        <option value="RO">Romania</option>
        <option value="BG">Bulgaria</option>
        <option value="UA">Ukraine</option>
        <option value="RU">Russia</option>

        <option value="GE">Georgia</option>
        <option value="AZ">Azerbaijan</option>
        <option value="AM">Armenia</option>

        <option value="IL">Israel</option>
        <option value="SA">Saudi Arabia</option>
        <option value="AE">United Arab Emirates</option>
        <option value="QA">Qatar</option>
        <option value="EG">Egypt</option>
        <option value="MA">Morocco</option>
        <option value="ZA">South Africa</option>
        <option value="NG">Nigeria</option>
        <option value="KE">Kenya</option>

        <option value="IN">India</option>
        <option value="PK">Pakistan</option>
        <option value="BD">Bangladesh</option>
        <option value="CN">China</option>
        <option value="JP">Japan</option>
        <option value="KR">South Korea</option>
        <option value="SG">Singapore</option>
        <option value="TH">Thailand</option>
        <option value="VN">Vietnam</option>
        <option value="ID">Indonesia</option>
        <option value="MY">Malaysia</option>
        <option value="PH">Philippines</option>

        <option value="AU">Australia</option>
        <option value="NZ">New Zealand</option>

        <option value="CA">Canada</option>
        <option value="MX">Mexico</option>
        <option value="BR">Brazil</option>
        <option value="AR">Argentina</option>
        <option value="CL">Chile</option>
        <option value="CO">Colombia</option>
        <option value="PE">Peru</option>

      </select>

      <button id="download">
        DOWNLOAD 1500 × 500 PNG
      </button>

      <button id="reset">
        RESET
      </button>

      <div class="hint">
        The artwork remains fixed. Only your personal and community
        information is customized.
      </div>

    </section>

    <section class="panel">

      <canvas
        id="canvas"
        width="1500"
        height="500"
      ></canvas>

    </section>

  </div>

</div>


<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const img = new Image();

img.src = "assets/banner-base.png";


/* =====================================================
   FIELDS
===================================================== */

const fields = [
  "name",
  "username",
  "location",
  "chapter",
  "country"
];


const defaults = {
  name: "YOUR NAME",
  username: "@YOUR_USERNAME",
  location: "YOUR CITY",
  chapter: "YOUR CHAPTER",
  country: ""
};


/* =====================================================
   TEXT POSITIONS
=====================================================

   Coordinates are based on the 1500 × 500 banner.

   NAME:
   moved slightly UP

   LOCATION:
   moved slightly DOWN

===================================================== */

const slots = {

  name: {
    x: 1307,
    y: 247,
    width: 115,
    maxFont: 17,
    minFont: 9
  },

  username: {
    x: 1307,
    y: 293,
    width: 115,
    maxFont: 17,
    minFont: 9
  },

  location: {
    x: 1307,
    y: 338,
    width: 115,
    maxFont: 17,
    minFont: 9
  },

  chapter: {
    x: 1307,
    y: 378,
    width: 83,
    maxFont: 17,
    minFont: 9
  }

};


/* =====================================================
   FONT
===================================================== */

const FONT_FAMILY =
  'Inter, "Segoe UI", system-ui, -apple-system, sans-serif';


/* =====================================================
   COUNTRY FLAG
===================================================== */

let flagImage = null;
let flagCode = "";
let flagLoading = false;
let flagError = false;


/*
  CORS is explicitly enabled.

  This prevents the remote flag from poisoning
  the canvas and breaking PNG download.
*/

function loadFlag(code) {

  flagImage = null;
  flagCode = code;
  flagError = false;

  if (!code) {
    flagLoading = false;
    draw();
    return Promise.resolve();
  }

  flagLoading = true;

  return new Promise((resolve) => {

    const flag = new Image();

    flag.crossOrigin = "anonymous";

    flag.onload = function() {

      flagImage = flag;
      flagLoading = false;
      flagError = false;

      draw();

      resolve();

    };

    flag.onerror = function() {

      flagImage = null;
      flagLoading = false;
      flagError = true;

      draw();

      resolve();

    };

    flag.src =
      `https://flagcdn.com/w40/${code.toLowerCase()}.png`;

  });

}


/* =====================================================
   TEXT FITTING
===================================================== */

function getFittedFont(
  text,
  maxWidth,
  maxSize,
  minSize
) {

  let size = maxSize;

  while (size > minSize) {

    ctx.font =
      `800 ${size}px ${FONT_FAMILY}`;

    if (
      ctx.measureText(text).width <= maxWidth
    ) {
      return size;
    }

    size -= 0.5;
  }

  return minSize;

}


/* =====================================================
   DRAW TEXT
===================================================== */

function drawValue(id) {

  const element =
    document.getElementById(id);

  if (!element) return;

  let value =
    element.value.trim();

  if (!value) {
    value = defaults[id];
  }


  /*
    NAME / USERNAME / LOCATION / CHAPTER

    We do NOT paint a white rectangle behind them.

    Therefore the original banner background remains
    completely visible.
  */

  const slot =
    slots[id];


  const fontSize =
    getFittedFont(
      value,
      slot.width,
      slot.maxFont,
      slot.minFont
    );


  ctx.font =
    `800 ${fontSize}px ${FONT_FAMILY}`;

  ctx.fillStyle =
    "#182b54";

  ctx.textBaseline =
    "middle";

  ctx.textAlign =
    "left";


  ctx.fillText(
    value,
    slot.x,
    slot.y
  );

}


/* =====================================================
   DRAW FLAG
===================================================== */

function drawFlag() {

  if (!flagImage) return;

  /*
    Small fixed flag.

    Position is inside the CHAPTER box.
  */

  const width = 24;
  const height = 16;

  const x = 1399;
  const y = 370;


  ctx.drawImage(
    flagImage,
    x,
    y,
    width,
    height
  );

}


/* =====================================================
   MAIN DRAW
===================================================== */

function draw() {

  /*
    Always clear the entire canvas.
  */

  ctx.clearRect(
    0,
    0,
    1500,
    500
  );


  /*
    Draw original artwork.

    EXACTLY 1500 × 500.

    No crop.
    No additional scaling.
  */

  ctx.drawImage(
    img,
    0,
    0,
    1500,
    500
  );


  /*
    IMPORTANT:

    There are NO white rectangles here.

    The banner itself remains the background.
  */


  drawValue("name");

  drawValue("username");

  drawValue("location");

  drawValue("chapter");

  drawFlag();

}


/* =====================================================
   IMAGE LOAD
===================================================== */

img.onload = function() {

  draw();

};


/* =====================================================
   LIVE INPUT
===================================================== */

document
  .getElementById("name")
  .addEventListener(
    "input",
    draw
  );


document
  .getElementById("username")
  .addEventListener(
    "input",
    draw
  );


document
  .getElementById("location")
  .addEventListener(
    "input",
    draw
  );


document
  .getElementById("chapter")
  .addEventListener(
    "input",
    draw
  );


/* =====================================================
   COUNTRY CHANGE
===================================================== */

document
  .getElementById("country")
  .addEventListener(
    "change",
    function() {

      loadFlag(
        this.value
      );

    }
  );


/* =====================================================
   DOWNLOAD
===================================================== */

document
  .getElementById("download")
  .addEventListener(
    "click",
    async function() {

      const button = this;

      button.disabled = true;

      button.textContent =
        "PREPARING PNG...";


      /*
        If a flag is selected but has not finished
        loading, wait for it first.
      */

      if (
        document.getElementById("country").value &&
        flagLoading
      ) {

        await new Promise(resolve => {

          const check =
            setInterval(() => {

              if (!flagLoading) {

                clearInterval(check);

                resolve();

              }

            }, 50);

        });

      }


      /*
        Redraw one final time before exporting.
      */

      draw();


      /*
        Give the browser one frame to finish drawing.
      */

      await new Promise(
        resolve =>
          requestAnimationFrame(resolve)
      );


      try {

        const dataURL =
          canvas.toDataURL(
            "image/png"
          );


        const link =
          document.createElement("a");


        link.download =
          "arc-community-banner-1500x500.png";


        link.href =
          dataURL;


        document.body.appendChild(
          link
        );


        link.click();


        document.body.removeChild(
          link
        );


      } catch (error) {

        console.error(error);

        alert(
          "The PNG could not be created. Please wait for the flag to finish loading and try again."
        );

      }


      button.disabled = false;

      button.textContent =
        "DOWNLOAD 1500 × 500 PNG";

    }
  );


/* =====================================================
   RESET
===================================================== */

document
  .getElementById("reset")
  .addEventListener(
    "click",
    function() {

      document.getElementById("name").value =
        defaults.name;

      document.getElementById("username").value =
        defaults.username;

      document.getElementById("location").value =
        defaults.location;

      document.getElementById("chapter").value =
        defaults.chapter;

      document.getElementById("country").value =
        defaults.country;


      flagImage = null;
      flagCode = "";
      flagLoading = false;
      flagError = false;


      draw();

    }
  );


</script>

</body>
</html>

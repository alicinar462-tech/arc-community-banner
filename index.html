.grid {

.panel {
  background: #fff;

}

input,

  border: 1px solid #cbd3df;
  border-radius: 9px;
  font-size: 14px;
  background: #fff;
  color: #18233b;
}

button {
  width: 100%;
  margin-top: 18px;
  border: 0;
  border-radius: 9px;
  padding: 12px;
  font-weight: 800;
  cursor: pointer;
}

#download {
  background: #172b55;
  color: #fff;
}

#reset {
  background: #edf1f6;
  color: #24324d;
}

canvas {
  width: 100%;
  height: auto;
  display: block;
  background: white;
  border-radius: 10px;
  border: 1px solid #dfe4ec;
}

.hint {
  font-size: 12px;
  line-height: 1.5;
  margin-top: 14px;
  color: #6a7486;
}

@media(max-width:850px) {
  .grid {
    grid-template-columns: 1fr;
  }
}

<script>

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

const img =
  new Image();

img.src =
  "assets/banner-base.png";


/* =====================================================
   DEFAULT VALUES
===================================================== */

const defaults = {
  name: "YOUR NAME",
  username: "@YOUR_USERNAME",
  location: "YOUR CITY",
  chapter: "YOUR CHAPTER",
  country: ""
};


/* =====================================================
   ELEMENTS
===================================================== */

const nameInput =
  document.getElementById("name");

const usernameInput =
  document.getElementById("username");

const locationInput =
  document.getElementById("location");

const chapterInput =
  document.getElementById("chapter");

const countrySelect =
  document.getElementById("country");


/* =====================================================
   IMPORTANT:
   FLAG STARTS EMPTY
===================================================== */

countrySelect.selectedIndex = 0;
countrySelect.value = "";


/* =====================================================
   TEXT POSITIONS
   MOVED LEFT TO SIT CLOSER TO LABELS
===================================================== */

const slots = {

  name: {
    x: 1305,
    y: 245,
    maxWidth: 105
  },

  username: {
    x: 1305,
    y: 288,
    maxWidth: 105
  },

  location: {
    x: 1305,
    y: 332,
    maxWidth: 105
  },

  chapter: {
    x: 1305,
    y: 376,
    maxWidth: 95
  }

};


/* =====================================================
   FLAG POSITION
===================================================== */

const flagSlot = {
  x: 1400,
  y: 376,
  width: 28,
  height: 19
};


/* =====================================================
   FONT
===================================================== */

const FONT_FAMILY =
  '"Arial", "Helvetica Neue", sans-serif';


/* =====================================================
   FLAG CACHE
===================================================== */

const flagCache = {};


/* =====================================================
   FIT TEXT
===================================================== */

function fitText(text, maxWidth, baseSize) {

  let size = baseSize;

  while (size >= 9) {

    ctx.font =
      `800 ${size}px ${FONT_FAMILY}`;

    if (
      ctx.measureText(text).width <= maxWidth
    ) {
      return {
        text,
        size
      };
    }

    size -= 0.5;
  }

  ctx.font =
    `800 9px ${FONT_FAMILY}`;

  let shortened = text;

  while (
    shortened.length > 3 &&
    ctx.measureText(shortened + "…").width > maxWidth
  ) {
    shortened =
      shortened.slice(0, -1);
  }

  return {
    text: shortened + "…",
    size: 9
  };
}


/* =====================================================
   DRAW BASE IMAGE
===================================================== */

function drawBaseImage() {

  const canvasRatio =
    canvas.width / canvas.height;

  const imageRatio =
    img.width / img.height;

  let drawWidth;
  let drawHeight;
  let offsetX;
  let offsetY;

  if (imageRatio > canvasRatio) {

    drawHeight =
      canvas.height;

    drawWidth =
      drawHeight * imageRatio;

    offsetX =
      (canvas.width - drawWidth) / 2;

    offsetY = 0;

  } else {

    drawWidth =
      canvas.width;

    drawHeight =
      drawWidth / imageRatio;

    offsetX = 0;

    offsetY =
      (canvas.height - drawHeight) / 2;
  }

  ctx.drawImage(
    img,
    offsetX,
    offsetY,
    drawWidth,
    drawHeight
  );
}


/* =====================================================
   USERNAME
===================================================== */

function normalizeUsername(value) {

  value =
    value.trim();

  if (!value) {
    return defaults.username;
  }

  if (!value.startsWith("@")) {
    value =
      "@" + value;
  }

  return value;
}


/* =====================================================
   DRAW TEXT FIELD
===================================================== */

function drawField(id) {

  const slot =
    slots[id];

  if (!slot) return;

  let value =
    document.getElementById(id).value.trim();

  if (!value) {
    value =
      defaults[id];
  }

  if (id === "username") {
    value =
      normalizeUsername(value);
  }

  const fitted =
    fitText(
      value,
      slot.maxWidth,
      14
    );

  ctx.font =
    `800 ${fitted.size}px ${FONT_FAMILY}`;

  ctx.fillStyle =
    "#182b54";

  ctx.textBaseline =
    "middle";

  ctx.textAlign =
    "left";

  ctx.fillText(
    fitted.text,
    slot.x,
    slot.y
  );
}


/* =====================================================
   LOAD REAL FLAG IMAGE
===================================================== */

function getFlag(code) {

  if (!code) {
    return null;
  }

  if (flagCache[code]) {
    return flagCache[code];
  }

  const flag =
    new Image();

  /*
    Important:
    This allows the downloaded canvas
    to remain usable.
  */

  flag.crossOrigin =
    "anonymous";

  flag.src =
    `https://flagcdn.com/w40/${code}.png`;

  flag.onload = () => {
    flagCache[code] = flag;
    draw();
  };

  flag.onerror = () => {
    console.warn(
      "Flag could not be loaded:",
      code
    );
  };

  flagCache[code] =
    flag;

  return flag;
}


/* =====================================================
   DRAW FLAG
===================================================== */

function drawFlag() {

  const code =
    countrySelect.value;

  /*
    Nothing selected:
    absolutely no flag is drawn.
  */

  if (!code) {
    return;
  }

  const flag =
    getFlag(code);

  if (!flag) {
    return;
  }

  if (!flag.complete || !flag.naturalWidth) {
    return;
  }

  ctx.drawImage(
    flag,
    flagSlot.x,
    flagSlot.y - flagSlot.height / 2,
    flagSlot.width,
    flagSlot.height
  );
}


/* =====================================================
   MAIN DRAW
===================================================== */

function draw() {

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  if (
    img.complete &&
    img.naturalWidth
  ) {

    drawBaseImage();

  } else {

    ctx.fillStyle =
      "#ffffff";

    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );
  }

  drawField("name");

  drawField("username");

  drawField("location");

  drawField("chapter");

  drawFlag();
}


/* =====================================================
   IMAGE LOAD
===================================================== */

img.onload = () => {
  draw();
};


/* =====================================================
   INPUT EVENTS
===================================================== */

[
  nameInput,
  usernameInput,
  locationInput,
  chapterInput
].forEach(element => {

  element.addEventListener(
    "input",
    draw
  );

});


/* =====================================================
   COUNTRY EVENT
===================================================== */

countrySelect.addEventListener(
  "change",
  () => {

    const code =
      countrySelect.value;

    if (code) {
      getFlag(code);
    }

    draw();

  }
);


/* =====================================================
   DOWNLOAD
===================================================== */

document
  .getElementById("download")
  .addEventListener(
    "click",
    () => {

      const link =
        document.createElement("a");

      link.download =
        "arc-community-banner-1500x500.png";

      link.href =
        canvas.toDataURL("image/png");

      link.click();

    }
  );


/* =====================================================
   RESET
===================================================== */

document
  .getElementById("reset")
  .addEventListener(
    "click",
    () => {

      nameInput.value =
        defaults.name;

      usernameInput.value =
        defaults.username;

      locationInput.value =
        defaults.location;

      chapterInput.value =
        defaults.chapter;

      /*
        Flag completely reset.
      */

      countrySelect.selectedIndex = 0;
      countrySelect.value = "";

      draw();

    }
  );


/* =====================================================
   INITIAL STATE
===================================================== */

countrySelect.selectedIndex = 0;
countrySelect.value = "";

draw();

</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Arc Community Banner — Customize</title>

<style>
  :root {
    font-family:
      Inter,
      ui-sans-serif,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: #f5f6f8;
    color: #18233b;
  }

  .wrap {
    max-width: 1180px;
    margin: 32px auto;
    padding: 0 20px 40px;
  }

  h1 {
    margin: 0 0 6px;
    font-size: 28px;
    font-weight: 800;
  }

  p {
    margin: 0 0 22px;
    color: #59647a;
  }

  .grid {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 24px;
    align-items: start;
  }

  .panel {
    background: #fff;
    border: 1px solid #dfe4ec;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 8px 28px rgba(20,35,60,.06);
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .05em;
    margin: 14px 0 6px;
  }

  input,
  select {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid #cbd3df;
    border-radius: 9px;
    font-size: 14px;
    font-family: inherit;
    background: #fff;
    color: #18233b;
  }

  button {
    width: 100%;
    margin-top: 18px;
    border: 0;
    border-radius: 9px;
    padding: 12px;
    font-weight: 800;
    cursor: pointer;
    font-family: inherit;
  }

  #download {
    background: #172b55;
    color: #fff;
  }

  #reset {
    background: #edf1f6;
    color: #24324d;
  }

  canvas {
    width: 100%;
    height: auto;
    display: block;
    background: #fff;
    border-radius: 10px;
    border: 1px solid #dfe4ec;
  }

  .hint {
    font-size: 12px;
    line-height: 1.5;
    margin-top: 14px;
    color: #6a7486;
  }

  @media(max-width:850px) {
    .grid {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>

<body>

<div class="wrap">

  <h1>Arc Community Banner</h1>

  <p>
    Fork the repository, personalize your fields, then download your
    1500 × 500 X/Twitter banner.
  </p>

  <div class="grid">

    <section class="panel">

      <label for="name">NAME</label>
      <input
        id="name"
        type="text"
        value="YOUR NAME"
        autocomplete="off"
      >

      <label for="username">USERNAME</label>
      <input
        id="username"
        type="text"
        value="@YOUR_USERNAME"
        autocomplete="off"
      >

      <label for="location">LOCATION</label>
      <input
        id="location"
        type="text"
        value="YOUR CITY"
        autocomplete="off"
      >

      <label for="chapter">CHAPTER</label>
      <input
        id="chapter"
        type="text"
        value="YOUR CHAPTER"
        autocomplete="off"
      >

      <label for="country">COUNTRY FLAG</label>

      <select id="country">
        <option value="">No flag</option>
        <option value="TR">Türkiye</option>
        <option value="US">United States</option>
        <option value="GB">United Kingdom</option>
        <option value="DE">Germany</option>
        <option value="FR">France</option>
        <option value="IT">Italy</option>
        <option value="ES">Spain</option>
        <option value="PT">Portugal</option>
        <option value="NL">Netherlands</option>
        <option value="BE">Belgium</option>
        <option value="CH">Switzerland</option>
        <option value="AT">Austria</option>
        <option value="SE">Sweden</option>
        <option value="NO">Norway</option>
        <option value="DK">Denmark</option>
        <option value="FI">Finland</option>
        <option value="PL">Poland</option>
        <option value="CZ">Czechia</option>
        <option value="GR">Greece</option>
        <option value="RO">Romania</option>
        <option value="BG">Bulgaria</option>
        <option value="UA">Ukraine</option>
        <option value="RU">Russia</option>
        <option value="GE">Georgia</option>
        <option value="AZ">Azerbaijan</option>
        <option value="AM">Armenia</option>
        <option value="IL">Israel</option>
        <option value="SA">Saudi Arabia</option>
        <option value="AE">United Arab Emirates</option>
        <option value="QA">Qatar</option>
        <option value="EG">Egypt</option>
        <option value="MA">Morocco</option>
        <option value="ZA">South Africa</option>
        <option value="NG">Nigeria</option>
        <option value="KE">Kenya</option>
        <option value="IN">India</option>
        <option value="PK">Pakistan</option>
        <option value="BD">Bangladesh</option>
        <option value="CN">China</option>
        <option value="JP">Japan</option>
        <option value="KR">South Korea</option>
        <option value="SG">Singapore</option>
        <option value="TH">Thailand</option>
        <option value="VN">Vietnam</option>
        <option value="ID">Indonesia</option>
        <option value="MY">Malaysia</option>
        <option value="PH">Philippines</option>
        <option value="AU">Australia</option>
        <option value="NZ">New Zealand</option>
        <option value="CA">Canada</option>
        <option value="MX">Mexico</option>
        <option value="BR">Brazil</option>
        <option value="AR">Argentina</option>
        <option value="CL">Chile</option>
        <option value="CO">Colombia</option>
        <option value="PE">Peru</option>
      </select>

      <button id="download">
        DOWNLOAD 1500 × 500 PNG
      </button>

      <button id="reset">
        RESET
      </button>

      <div class="hint">
        The artwork remains fixed. Only your personal and community
        information is customized.
      </div>

    </section>

    <section class="panel">
      <canvas
        id="canvas"
        width="1500"
        height="500"
      ></canvas>
    </section>

  </div>
</div>


<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const img = new Image();

/*
  IMPORTANT:
  Keep your banner image here.
*/
img.src = "assets/banner-base.png";


const fields = [
  "name",
  "username",
  "location",
  "chapter",
  "country"
];


const defaults = {
  name: "YOUR NAME",
  username: "@YOUR_USERNAME",
  location: "YOUR CITY",
  chapter: "YOUR CHAPTER",
  country: ""
};


/*
  -------------------------------------------------------
  TEXT SETTINGS
  -------------------------------------------------------

  These coordinates are based on the current 1500x500
  banner layout.

  The labels NAME / USERNAME / LOCATION / CHAPTER are
  already part of the background image.

  We only draw the values.
*/

const slots = {

  name: {
    x: 1308,
    y: 250,
    width: 112,
    maxFont: 17,
    minFont: 9
  },

  username: {
    x: 1308,
    y: 289,
    width: 112,
    maxFont: 17,
    minFont: 9
  },

  location: {
    x: 1308,
    y: 328,
    width: 112,
    maxFont: 17,
    minFont: 9
  },

  chapter: {
    x: 1308,
    y: 377,
    width: 88,
    maxFont: 17,
    minFont: 9
  }

};


/*
  -------------------------------------------------------
  FONT
  -------------------------------------------------------
*/

const FONT_FAMILY =
  'Inter, "Segoe UI", system-ui, -apple-system, sans-serif';


/*
  -------------------------------------------------------
  SAFE TEXT FIT
  -------------------------------------------------------
*/

function getFittedFont(text, maxWidth, maxSize, minSize) {

  let size = maxSize;

  while (size > minSize) {

    ctx.font = `800 ${size}px ${FONT_FAMILY}`;

    if (ctx.measureText(text).width <= maxWidth) {
      return size;
    }

    size -= 0.5;
  }

  return minSize;
}


/*
  -------------------------------------------------------
  DRAW TEXT
  -------------------------------------------------------
*/

function drawValue(id) {

  const input = document.getElementById(id);

  if (!input) return;

  let value = input.value.trim();

  if (!value) {
    value = defaults[id];
  }

  const slot = slots[id];

  /*
    Do NOT allow the text to become huge.

    Short text:
      17px

    Medium text:
      automatically smaller

    Very long text:
      minimum 9px
  */

  const fontSize = getFittedFont(
    value,
    slot.width,
    slot.maxFont,
    slot.minFont
  );

  ctx.font = `800 ${fontSize}px ${FONT_FAMILY}`;
  ctx.fillStyle = "#182b54";
  ctx.textBaseline = "middle";
  ctx.textAlign = "left";

  ctx.fillText(
    value,
    slot.x,
    slot.y
  );
}


/*
  -------------------------------------------------------
  COUNTRY FLAG
  -------------------------------------------------------

  We deliberately DO NOT draw emoji flags.

  Emoji flags are rendered differently by different
  browsers and operating systems and can become enormous
  when rendered on canvas.

  Instead we use a small image with a fixed size.
*/

function drawFlag(code) {

  if (!code) return;

  const flag = new Image();

  /*
    Fixed-size flag area.
    24 x 16 keeps it inside the chapter box.
  */

  flag.onload = function() {

    const flagWidth = 24;
    const flagHeight = 16;

    const x = 1400;
    const y = 369;

    ctx.drawImage(
      flag,
      x,
      y,
      flagWidth,
      flagHeight
    );

  };

  /*
    FlagCDN provides ISO country flags.
  */

  flag.src =
    `https://flagcdn.com/w40/${code.toLowerCase()}.png`;
}


/*
  -------------------------------------------------------
  DRAW
  -------------------------------------------------------
*/

function draw() {

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  /*
    Draw the original banner at EXACTLY 1500x500.

    No automatic scaling.
    No cropping.
    No stretching.
  */

  ctx.drawImage(
    img,
    0,
    0,
    1500,
    500
  );


  /*
    Clean only the value areas.

    This prevents old values from remaining when the
    user changes the text.
  */

  const cleanAreas = [

    {
      x: 1300,
      y: 237,
      w: 125,
      h: 26
    },

    {
      x: 1300,
      y: 276,
      w: 125,
      h: 26
    },

    {
      x: 1300,
      y: 315,
      w: 125,
      h: 26
    },

    {
      x: 1300,
      y: 363,
      w: 105,
      h: 27
    }

  ];


  ctx.fillStyle = "#ffffff";


  for (const area of cleanAreas) {

    ctx.fillRect(
      area.x,
      area.y,
      area.w,
      area.h
    );

  }


  /*
    Draw the four user values.
  */

  drawValue("name");
  drawValue("username");
  drawValue("location");
  drawValue("chapter");


  /*
    Draw selected country flag.
  */

  const country =
    document.getElementById("country").value;

  drawFlag(country);
}


/*
  -------------------------------------------------------
  IMAGE LOAD
  -------------------------------------------------------
*/

img.onload = function() {
  draw();
};


/*
  -------------------------------------------------------
  LIVE UPDATE
  -------------------------------------------------------
*/

fields.forEach(id => {

  const element =
    document.getElementById(id);

  if (!element) return;

  element.addEventListener(
    "input",
    draw
  );

  element.addEventListener(
    "change",
    draw
  );

});


/*
  -------------------------------------------------------
  DOWNLOAD
  -------------------------------------------------------
*/

document
  .getElementById("download")
  .addEventListener("click", () => {

    const link =
      document.createElement("a");

    link.download =
      "arc-community-banner-1500x500.png";

    link.href =
      canvas.toDataURL("image/png");

    link.click();

  });


/*
  -------------------------------------------------------
  RESET
  -------------------------------------------------------
*/

document
  .getElementById("reset")
  .addEventListener("click", () => {

    document
      .getElementById("name")
      .value = defaults.name;

    document
      .getElementById("username")
      .value = defaults.username;

    document
      .getElementById("location")
      .value = defaults.location;

    document
      .getElementById("chapter")
      .value = defaults.chapter;

    document
      .getElementById("country")
      .value = defaults.country;

    draw();

  });

</script>

</body>
</html>

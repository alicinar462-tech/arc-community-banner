<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arc Community Banner — Customize</title>

<style>
  :root {
    font-family:
      Inter,
      ui-sans-serif,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      Arial,
      sans-serif;
  }

  body {
    margin: 0;
    background: #f5f6f8;
    color: #18233b;
  }

  .wrap {
    max-width: 1180px;
    margin: 32px auto;
    padding: 0 20px 40px;
  }

  h1 {
    margin: 0 0 6px;
    font-size: 28px;
  }

  p {
    margin: 0 0 22px;
    color: #59647a;
  }

  .grid {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 24px;
    align-items: start;
  }

  .panel {
    background: #fff;
    border: 1px solid #dfe4ec;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 8px 28px rgba(20,35,60,.06);
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .05em;
    margin: 14px 0 6px;
  }

  input {
    width: 100%;
    box-sizing: border-box;
    padding: 11px 12px;
    border: 1px solid #cbd3df;
    border-radius: 9px;
    font-size: 14px;
    outline: none;
  }

  input:focus {
    border-color: #6574d8;
    box-shadow: 0 0 0 3px rgba(101,116,216,.12);
  }

  button {
    width: 100%;
    margin-top: 18px;
    border: 0;
    border-radius: 9px;
    padding: 12px;
    font-weight: 800;
    cursor: pointer;
  }

  #download {
    background: #172b55;
    color: #fff;
  }

  #reset {
    background: #edf1f6;
    color: #24324d;
  }

  canvas {
    width: 100%;
    height: auto;
    display: block;
    background: #fff;
    border-radius: 10px;
    border: 1px solid #dfe4ec;
  }

  .hint {
    font-size: 12px;
    line-height: 1.5;
    margin-top: 14px;
    color: #6a7486;
  }

  @media(max-width:850px) {
    .grid {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>

<body>

<div class="wrap">

  <h1>Arc Community Banner</h1>

  <p>
    Fork the repository, personalize these fields, then download your
    1500 × 500 X/Twitter banner.
  </p>

  <div class="grid">

    <section class="panel">

      <label for="name">NAME</label>
      <input id="name" value="YOUR NAME">

      <label for="username">USERNAME</label>
      <input id="username" value="@YOUR_USERNAME">

      <label for="location">LOCATION</label>
      <input id="location" value="YOUR CITY">

      <label for="country">COUNTRY</label>
      <input id="country" value="YOUR COUNTRY">

      <label for="chapter">CHAPTER</label>
      <input id="chapter" value="YOUR CHAPTER">

      <button id="download">
        DOWNLOAD 1500 × 500 PNG
      </button>

      <button id="reset">
        RESET
      </button>

      <div class="hint">
        The artwork remains fixed; only your personal and community fields
        are editable. The avatar area remains open for X/Twitter's profile
        image.
      </div>

    </section>

    <section class="panel">
      <canvas id="canvas" width="1500" height="500"></canvas>
    </section>

  </div>
</div>


<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const img = new Image();

img.src = "assets/banner-base.png";


const fields = [
  "name",
  "username",
  "location",
  "country",
  "chapter"
];


const defaults = {
  name: "YOUR NAME",
  username: "@YOUR_USERNAME",
  location: "YOUR CITY",
  country: "YOUR COUNTRY",
  chapter: "YOUR CHAPTER"
};


/*
  ---------------------------------------------------------
  TEXT CONFIGURATION
  ---------------------------------------------------------
*/

const slots = [

  {
    id: "name",

    /*
      Position of the actual user value inside
      the NAME card.
    */
    x: 1095,
    y: 198,

    /*
      Maximum available width before
      the text begins to shrink.
    */
    max: 105,

    size: 15
  },

  {
    id: "username",
    x: 1095,
    y: 237,
    max: 105,
    size: 13
  },

  {
    id: "location",
    x: 1095,
    y: 276,
    max: 105,
    size: 13
  },

  {
    id: "country",
    x: 1095,
    y: 315,
    max: 105,
    size: 13
  },

  {
    id: "chapter",
    x: 1095,
    y: 354,
    max: 105,
    size: 13
  }

];


/*
  ---------------------------------------------------------
  FONT / TEXT HELPERS
  ---------------------------------------------------------
*/

function getFont(size) {
  return `700 ${size}px Inter, Arial, sans-serif`;
}


/*
  Finds the largest font size that fits
  inside the available width.
*/
function fitFont(text, maxWidth, startSize) {

  let size = startSize;

  while (size > 8) {

    ctx.font = getFont(size);

    if (ctx.measureText(text).width <= maxWidth) {
      return size;
    }

    size -= 0.5;
  }

  return 8;
}


/*
  Returns a clipped version if even the smallest
  font cannot fit.
*/
function fitText(text, maxWidth, startSize) {

  let size = fitFont(text, maxWidth, startSize);

  ctx.font = getFont(size);

  if (ctx.measureText(text).width <= maxWidth) {
    return {
      text,
      size
    };
  }

  let shortened = text;

  while (
    shortened.length > 3 &&
    ctx.measureText(shortened + "…").width > maxWidth
  ) {

    shortened = shortened.slice(0, -1);
  }

  return {
    text: shortened + "…",
    size
  };
}


/*
  ---------------------------------------------------------
  DRAW
  ---------------------------------------------------------
*/

function draw() {

  /*
    Clear canvas.
  */
  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /*
    Draw original banner artwork.
  */
  ctx.drawImage(
    img,
    0,
    0,
    1500,
    500
  );


  /*
    Draw user/community values.
  */
  for (const slot of slots) {

    const input =
      document.getElementById(slot.id);

    let value =
      input.value.trim();

    if (!value) {
      value = defaults[slot.id];
    }


    /*
      The banner uses the code-like format:

      </Ali Çınar>
      </@malto>
      </İzmir>
      </Türkiye>
      </Arc Türkiye>
    */

    value = `</${value}>`;


    /*
      Calculate appropriate font size.
    */
    const fitted =
      fitText(
        value,
        slot.max,
        slot.size
      );


    /*
      -----------------------------------------------------
      CLEAN VALUE AREA
      -----------------------------------------------------

      We intentionally clean only the right-side
      value region.

      The existing NAME / USERNAME / LOCATION /
      COUNTRY / CHAPTER labels remain untouched.
    */

    ctx.fillStyle = "#ffffff";

    ctx.fillRect(
      slot.x - 5,
      slot.y - 12,
      slot.max + 10,
      24
    );


    /*
      -----------------------------------------------------
      TEXT
      -----------------------------------------------------
    */

    ctx.font =
      getFont(fitted.size);

    ctx.fillStyle =
      "#182b54";

    ctx.textAlign =
      "left";

    ctx.textBaseline =
      "middle";

    ctx.fillText(
      fitted.text,
      slot.x,
      slot.y
    );
  }
}


/*
  ---------------------------------------------------------
  IMAGE LOAD
  ---------------------------------------------------------
*/

img.onload = function() {
  draw();
};


/*
  ---------------------------------------------------------
  LIVE PREVIEW
  ---------------------------------------------------------
*/

fields.forEach(function(id) {

  document
    .getElementById(id)
    .addEventListener(
      "input",
      draw
    );

});


/*
  ---------------------------------------------------------
  DOWNLOAD
  ---------------------------------------------------------
*/

document
  .getElementById("download")
  .addEventListener("click", function() {

    const a =
      document.createElement("a");

    a.download =
      "arc-community-banner-1500x500.png";

    a.href =
      canvas.toDataURL("image/png");

    a.click();

  });


/*
  ---------------------------------------------------------
  RESET
  ---------------------------------------------------------
*/

document
  .getElementById("reset")
  .addEventListener("click", function() {

    fields.forEach(function(id) {

      document
        .getElementById(id)
        .value =
        defaults[id];

    });

    draw();

  });

</script>

</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arc Community Banner — Customize</title>

<style>
  :root {
    font-family:
      "Segoe UI",
      "Helvetica Neue",
      Arial,
      sans-serif;
  }

  body {
    margin: 0;
    background: #f5f6f8;
    color: #18233b;
  }

  .wrap {
    max-width: 1180px;
    margin: 32px auto;
    padding: 0 20px 40px;
  }

  h1 {
    margin: 0 0 6px;
    font-size: 28px;
  }

  p {
    margin: 0 0 22px;
    color: #59647a;
  }

  .grid {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 24px;
    align-items: start;
  }

  .panel {
    background: #fff;
    border: 1px solid #dfe4ec;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 8px 28px rgba(20,35,60,.06);
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .05em;
    margin: 14px 0 6px;
  }

  input,
  select {
    width: 100%;
    box-sizing: border-box;
    padding: 11px 12px;
    border: 1px solid #cbd3df;
    border-radius: 9px;
    font-size: 14px;
    background: #fff;
  }

  button {
    width: 100%;
    margin-top: 18px;
    border: 0;
    border-radius: 9px;
    padding: 12px;
    font-weight: 800;
    cursor: pointer;
  }

  #download {
    background: #172b55;
    color: #fff;
  }

  #reset {
    background: #edf1f6;
    color: #24324d;
  }

  canvas {
    width: 100%;
    height: auto;
    display: block;
    background: white;
    border-radius: 10px;
    border: 1px solid #dfe4ec;
  }

  .hint {
    font-size: 12px;
    line-height: 1.5;
    margin-top: 14px;
    color: #6a7486;
  }

  @media(max-width:850px) {
    .grid {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>

<body>

<div class="wrap">

  <h1>Arc Community Banner</h1>

  <p>
    Customize your Arc community profile and download your 1500 × 500 X/Twitter banner.
  </p>

  <div class="grid">

    <section class="panel">

      <label for="name">NAME</label>
      <input id="name" value="YOUR NAME">

      <label for="username">USERNAME</label>
      <input id="username" value="@YOUR_USERNAME">

      <label for="location">LOCATION</label>
      <input id="location" value="YOUR CITY">

      <label for="chapter">CHAPTER</label>
      <input id="chapter" value="YOUR CHAPTER">

      <label for="country">COUNTRY</label>
      <select id="country">

        <option value="TR" selected>Turkey</option>
        <option value="US">United States</option>
        <option value="GB">United Kingdom</option>
        <option value="DE">Germany</option>
        <option value="FR">France</option>
        <option value="IT">Italy</option>
        <option value="ES">Spain</option>
        <option value="NL">Netherlands</option>
        <option value="BE">Belgium</option>
        <option value="CH">Switzerland</option>
        <option value="AT">Austria</option>
        <option value="SE">Sweden</option>
        <option value="NO">Norway</option>
        <option value="DK">Denmark</option>
        <option value="FI">Finland</option>
        <option value="PL">Poland</option>
        <option value="PT">Portugal</option>
        <option value="GR">Greece</option>
        <option value="RO">Romania</option>
        <option value="BG">Bulgaria</option>
        <option value="UA">Ukraine</option>
        <option value="RU">Russia</option>
        <option value="CA">Canada</option>
        <option value="MX">Mexico</option>
        <option value="BR">Brazil</option>
        <option value="AR">Argentina</option>
        <option value="CL">Chile</option>
        <option value="AU">Australia</option>
        <option value="NZ">New Zealand</option>
        <option value="JP">Japan</option>
        <option value="KR">South Korea</option>
        <option value="CN">China</option>
        <option value="IN">India</option>
        <option value="ID">Indonesia</option>
        <option value="SG">Singapore</option>
        <option value="MY">Malaysia</option>
        <option value="TH">Thailand</option>
        <option value="VN">Vietnam</option>
        <option value="PH">Philippines</option>
        <option value="AE">United Arab Emirates</option>
        <option value="SA">Saudi Arabia</option>
        <option value="QA">Qatar</option>
        <option value="IL">Israel</option>
        <option value="EG">Egypt</option>
        <option value="ZA">South Africa</option>
        <option value="NG">Nigeria</option>
        <option value="KE">Kenya</option>

      </select>

      <button id="download">
        DOWNLOAD 1500 × 500 PNG
      </button>

      <button id="reset">
        RESET
      </button>

      <div class="hint">
        Your personal information is placed directly inside the profile fields.
        Select a country to display its flag beside the chapter.
      </div>

    </section>

    <section class="panel">
      <canvas id="canvas" width="1500" height="500"></canvas>
    </section>

  </div>
</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const img = new Image();

img.src = "assets/banner-base.png";


/* -------------------------------------------------------
   DEFAULT VALUES
------------------------------------------------------- */

const defaults = {
  name: "YOUR NAME",
  username: "@YOUR_USERNAME",
  location: "YOUR CITY",
  chapter: "YOUR CHAPTER",
  country: "TR"
};


/* -------------------------------------------------------
   FLAG IMAGE CACHE
------------------------------------------------------- */

const flagCache = {};


/*
  Flag images come from FlagCDN.
  They are loaded as real images instead of emoji,
  so the canvas will not display TR / PL / US as text.
*/

function loadFlag(code) {

  if (!code) return null;

  if (flagCache[code]) {
    return flagCache[code];
  }

  const flag = new Image();

  flag.crossOrigin = "anonymous";

  flag.onload = function() {
    flagCache[code] = flag;
    draw();
  };

  flag.onerror = function() {
    flagCache[code] = null;
    draw();
  };

  flag.src =
    "https://flagcdn.com/w40/" +
    code.toLowerCase() +
    ".png";

  flagCache[code] = flag;

  return flag;
}


/* -------------------------------------------------------
   TEXT FITTING
------------------------------------------------------- */

function getFittedFont(text, maxWidth) {

  const family =
    '"Segoe UI", "Helvetica Neue", sans-serif';

  let size = 15;

  while (size > 9) {

    ctx.font =
      `700 ${size}px ${family}`;

    if (
      ctx.measureText(text).width <= maxWidth
    ) {
      return `700 ${size}px ${family}`;
    }

    size -= 0.5;
  }

  return `700 9px ${family}`;
}


/* -------------------------------------------------------
   DRAW BANNER
------------------------------------------------------- */

function draw() {

  ctx.clearRect(
    0,
    0,
    1500,
    500
  );

  /*
    Keep the original 1500 × 500 artwork
    exactly as it is.
  */

  ctx.drawImage(
    img,
    0,
    0,
    1500,
    500
  );


  /*
    RIGHT-SIDE PROFILE FIELDS

    The label remains part of the original artwork.

    We only draw the user's value in the
    empty area on the right.
  */

  const slots = {

    name: {
      centerX: 1368,
      y: 245,
      maxWidth: 120
    },

    username: {
      centerX: 1368,
      y: 291,
      maxWidth: 120
    },

    location: {
      centerX: 1368,
      y: 337,
      maxWidth: 120
    },

    chapter: {
      centerX: 1342,
      y: 376,
      maxWidth: 82
    }

  };


  const family =
    '"Segoe UI", "Helvetica Neue", sans-serif';


  /* -----------------------------------------------------
     NAME
  ----------------------------------------------------- */

  drawNormalField(
    "name",
    slots.name
  );


  /* -----------------------------------------------------
     USERNAME
  ----------------------------------------------------- */

  drawNormalField(
    "username",
    slots.username
  );


  /* -----------------------------------------------------
     LOCATION
  ----------------------------------------------------- */

  drawNormalField(
    "location",
    slots.location
  );


  /* -----------------------------------------------------
     CHAPTER + FLAG
  ----------------------------------------------------- */

  drawChapter(
    slots.chapter
  );
}


/* -------------------------------------------------------
   NORMAL FIELD
------------------------------------------------------- */

function drawNormalField(
  id,
  slot
) {

  const input =
    document.getElementById(id);

  let value =
    input.value.trim();

  if (!value) {
    value = defaults[id];
  }


  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  ctx.font =
    getFittedFont(
      value,
      slot.maxWidth
    );

  ctx.fillStyle =
    "#182b54";

  ctx.fillText(
    value,
    slot.centerX,
    slot.y
  );
}


/* -------------------------------------------------------
   CHAPTER FIELD
------------------------------------------------------- */

function drawChapter(slot) {

  const input =
    document.getElementById("chapter");

  let value =
    input.value.trim();

  if (!value) {
    value = defaults.chapter;
  }


  /*
    Country selected from dropdown.
  */

  const code =
    document.getElementById("country").value;


  /*
    Text area is deliberately separated
    from the flag area.
  */

  const textCenterX =
    1335;

  const textMaxWidth =
    78;


  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "middle";


  ctx.font =
    getFittedFont(
      value,
      textMaxWidth
    );

  ctx.fillStyle =
    "#182b54";


  ctx.fillText(
    value,
    textCenterX,
    slot.y
  );


  /*
    FLAG
    ----
    Real image, not text.
  */

  const flag =
    loadFlag(code);


  if (
    flag &&
    flag.complete &&
    flag.naturalWidth > 0
  ) {

    const flagWidth = 24;
    const flagHeight = 16;

    ctx.drawImage(
      flag,
      1400,
      slot.y - flagHeight / 2,
      flagWidth,
      flagHeight
    );

  }

}


/* -------------------------------------------------------
   IMAGE LOAD
------------------------------------------------------- */

img.onload = function() {

  /*
    Preload the default Turkish flag.
  */

  loadFlag(
    document.getElementById("country").value
  );

  draw();
};


/* -------------------------------------------------------
   INPUT EVENTS
------------------------------------------------------- */

document
  .getElementById("name")
  .addEventListener(
    "input",
    draw
  );


document
  .getElementById("username")
  .addEventListener(
    "input",
    draw
  );


document
  .getElementById("location")
  .addEventListener(
    "input",
    draw
  );


document
  .getElementById("chapter")
  .addEventListener(
    "input",
    draw
  );


/* -------------------------------------------------------
   COUNTRY CHANGE
------------------------------------------------------- */

document
  .getElementById("country")
  .addEventListener(
    "change",
    function() {

      const code =
        this.value;

      loadFlag(code);

      draw();

    }
  );


/* -------------------------------------------------------
   DOWNLOAD
------------------------------------------------------- */

document
  .getElementById("download")
  .addEventListener(
    "click",
    function() {

      try {

        const link =
          document.createElement("a");

        link.download =
          "arc-community-banner-1500x500.png";

        link.href =
          canvas.toDataURL(
            "image/png"
          );

        document.body.appendChild(link);

        link.click();

        document.body.removeChild(link);

      } catch (error) {

        console.error(error);

        alert(
          "The banner could not be downloaded. Please try again."
        );

      }

    }
  );


/* -------------------------------------------------------
   RESET
------------------------------------------------------- */

document
  .getElementById("reset")
  .addEventListener(
    "click",
    function() {

      document.getElementById("name").value =
        defaults.name;

      document.getElementById("username").value =
        defaults.username;

      document.getElementById("location").value =
        defaults.location;

      document.getElementById("chapter").value =
        defaults.chapter;

      document.getElementById("country").value =
        defaults.country;

      loadFlag(
        defaults.country
      );

      draw();

    }
  );

</script>

</body>
</html>

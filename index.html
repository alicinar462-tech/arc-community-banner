<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const img = new Image();

img.src = "assets/banner-base.png";

const fields = [
  "name",
  "username",
  "location",
  "chapter",
  "country"
];

const defaults = {
  name: "YOUR NAME",
  username: "@YOUR_USERNAME",
  location: "YOUR CITY",
  chapter: "YOUR CHAPTER",
  country: ""
};


/*
=========================================================
BANNER COORDINATES
=========================================================

These coordinates correspond to the current
1500 × 500 banner.

The right-side cards are:

NAME
USERNAME
LOCATION
CHAPTER

Country card has been removed.
*/


const slots = {

  name: {
    x: 1375,
    y: 245,
    maxWidth: 105
  },

  username: {
    x: 1375,
    y: 288,
    maxWidth: 105
  },

  location: {
    x: 1375,
    y: 332,
    maxWidth: 105
  },

  chapter: {
    x: 1375,
    y: 376,
    maxWidth: 105
  }

};


/*
=========================================================
FONT
=========================================================
*/

const FONT_FAMILY =
  '"Arial", "Helvetica Neue", sans-serif';


/*
=========================================================
TEXT FIT
=========================================================
*/

function fitText(text, maxWidth, baseSize) {

  let size = baseSize;

  while (size >= 9) {

    ctx.font =
      `800 ${size}px ${FONT_FAMILY}`;

    if (
      ctx.measureText(text).width <= maxWidth
    ) {
      return {
        text,
        size
      };
    }

    size -= 0.5;
  }

  ctx.font =
    `800 9px ${FONT_FAMILY}`;

  let shortened = text;

  while (
    shortened.length > 3 &&
    ctx.measureText(shortened + "…").width > maxWidth
  ) {
    shortened =
      shortened.slice(0, -1);
  }

  return {
    text: shortened + "…",
    size: 9
  };
}


/*
=========================================================
DRAW BASE IMAGE
=========================================================

IMPORTANT:

The image is fitted proportionally.
It is NOT stretched independently in X/Y.
*/


function drawBaseImage() {

  const canvasRatio =
    canvas.width / canvas.height;

  const imageRatio =
    img.width / img.height;

  let drawWidth;
  let drawHeight;
  let offsetX;
  let offsetY;

  if (imageRatio > canvasRatio) {

    drawHeight = canvas.height;

    drawWidth =
      drawHeight * imageRatio;

    offsetX =
      (canvas.width - drawWidth) / 2;

    offsetY = 0;

  } else {

    drawWidth = canvas.width;

    drawHeight =
      drawWidth / imageRatio;

    offsetX = 0;

    offsetY =
      (canvas.height - drawHeight) / 2;
  }

  ctx.drawImage(
    img,
    offsetX,
    offsetY,
    drawWidth,
    drawHeight
  );
}


/*
=========================================================
NORMALIZE USERNAME
=========================================================
*/

function normalizeUsername(value) {

  value = value.trim();

  if (!value) {
    return defaults.username;
  }

  if (!value.startsWith("@")) {
    value = "@" + value;
  }

  return value;
}


/*
=========================================================
DRAW FIELD
=========================================================
*/

function drawField(id) {

  const slot = slots[id];

  if (!slot) return;

  let value =
    document.getElementById(id).value.trim();

  if (!value) {
    value = defaults[id];
  }

  if (id === "username") {
    value = normalizeUsername(value);
  }


  /*
  -------------------------------------------------------
  Text styling
  -------------------------------------------------------
  */

  const fitted =
    fitText(
      value,
      slot.maxWidth,
      14
    );

  ctx.font =
    `800 ${fitted.size}px ${FONT_FAMILY}`;

  ctx.fillStyle =
    "#182b54";

  ctx.textBaseline =
    "middle";

  ctx.textAlign =
    "left";


  /*
  -------------------------------------------------------
  Draw text
  -------------------------------------------------------
  */

  ctx.fillText(
    fitted.text,
    slot.x,
    slot.y
  );
}


/*
=========================================================
DRAW FLAG
=========================================================
*/

function drawFlag() {

  const country =
    document.getElementById("country").value;

  if (!country) return;


  /*
  Flag is placed at the right side of CHAPTER card.
  */

  ctx.font =
    "800 20px Arial, sans-serif";

  ctx.textAlign =
    "left";

  ctx.textBaseline =
    "middle";

  ctx.fillText(
    country,
    1470,
    slots.chapter.y
  );
}


/*
=========================================================
MAIN DRAW
=========================================================
*/

function draw() {

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /*
  Base banner
  */

  if (img.complete && img.naturalWidth) {

    drawBaseImage();

  } else {

    ctx.fillStyle = "#ffffff";

    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );
  }


  /*
  Personal fields
  */

  drawField("name");

  drawField("username");

  drawField("location");

  drawField("chapter");

  drawFlag();
}


/*
=========================================================
IMAGE LOAD
=========================================================
*/

img.onload = () => {

  draw();

};


/*
=========================================================
LIVE UPDATE
=========================================================
*/

fields.forEach(id => {

  const element =
    document.getElementById(id);

  element.addEventListener(
    "input",
    draw
  );

  element.addEventListener(
    "change",
    draw
  );

});


/*
=========================================================
DOWNLOAD
=========================================================
*/

document
  .getElementById("download")
  .addEventListener("click", () => {

    const link =
      document.createElement("a");

    link.download =
      "arc-community-banner-1500x500.png";

    link.href =
      canvas.toDataURL("image/png");

    link.click();

  });


/*
=========================================================
RESET
=========================================================
*/

document
  .getElementById("reset")
  .addEventListener("click", () => {

    document.getElementById("name").value =
      defaults.name;

    document.getElementById("username").value =
      defaults.username;

    document.getElementById("location").value =
      defaults.location;

    document.getElementById("chapter").value =
      defaults.chapter;

    document.getElementById("country").value =
      defaults.country;

    draw();

  });

</script>

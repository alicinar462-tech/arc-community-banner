<!doctype html>

<title>Arc Community Banner — Customize</title>

<style>
  :root {
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
      "Segoe UI", sans-serif;
  }

  body {
    margin: 0;
    background: #f5f6f8;
    color: #18233b;
  }

  .wrap {
    max-width: 1180px;
    margin: 32px auto;
    padding: 0 20px 40px;
  }

  h1 {
    margin: 0 0 6px;
    font-size: 28px;
  }

  p {
    margin: 0 0 22px;
    color: #59647a;
  }

  .grid {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 24px;
    align-items: start;
  }

  .panel {
    background: #fff;
    border: 1px solid #dfe4ec;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 8px 28px rgba(20,35,60,.06);
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .05em;
    margin: 14px 0 6px;
  }

  input,
  select {
    width: 100%;
    box-sizing: border-box;
    padding: 11px 12px;
    border: 1px solid #cbd3df;
    border-radius: 9px;
    font-size: 14px;
    background: #fff;
  }

  button {
    width: 100%;
    margin-top: 18px;
    border: 0;
    border-radius: 9px;
    padding: 12px;
    font-weight: 800;
    cursor: pointer;
  }

  #download {
    background: #172b55;
    color: #fff;
  }

  #reset {
    background: #edf1f6;
    color: #24324d;
  }

  canvas {
    width: 100%;
    height: auto;
    display: block;
    background: transparent;
    border-radius: 10px;
    border: 1px solid #dfe4ec;
  }

  .hint {
    font-size: 12px;
    line-height: 1.5;
    margin-top: 14px;
    color: #6a7486;
  }

  @media(max-width:850px) {
    .grid {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>

<body>

<div class="wrap">

  <h1>Arc Community Banner</h1>

  <p>
    Fork the repository, personalize these fields, then download your
    1500 × 500 X/Twitter banner.
  </p>

  <div class="grid">

    <section class="panel">

      <label for="name">NAME</label>
      <input id="name" value="YOUR NAME">

      <label for="username">USERNAME</label>
      <input id="username" value="@YOUR_USERNAME">

      <label for="location">LOCATION</label>
      <input id="location" value="YOUR CITY">

      <label for="chapter">CHAPTER</label>
      <input id="chapter" value="YOUR CHAPTER">

      <label for="flag">FLAG</label>
      <select id="flag">
        <option value="">Choose Flag</option>
      </select>

      <button id="download">
        DOWNLOAD 1500 × 500 PNG
      </button>

      <button id="reset">
        RESET
      </button>

      <div class="hint">
        The artwork remains fixed; only your personal/community fields are editable.
        The flag is optional.
      </div>

    </section>

    <section class="panel">
      <canvas id="canvas" width="1500" height="500"></canvas>
    </section>

  </div>
</div>

const ctx = canvas.getContext('2d');

const img = new Image();
img.src = 'assets/banner-base.png';

  'location',
  'chapter'

  username: '@YOUR_USERNAME',
  location: 'YOUR CITY',

  const option = document.createElement('option');

  option.value = code;
  option.textContent = name;

  flagSelect.appendChild(option);

});


/* -------------------------------------------------------
   TEXT FITTING
------------------------------------------------------- */

function fitText(text, maxWidth, font) {

  ctx.font = font;

  if (ctx.measureText(text).width <= maxWidth) {
    return text;
  }

  let s = text;

  while (
    s.length > 3 &&
    ctx.measureText(s + '…').width > maxWidth
  ) {
    s = s.slice(0, -1);
  }

  return s + '…';
}


/* -------------------------------------------------------
   FLAG IMAGE
------------------------------------------------------- */

let flagImage = null;
let flagCode = '';

function loadFlag(code) {

  flagImage = null;
  flagCode = code;

  if (!code) {
    draw();
    return;
  }

  const image = new Image();

  image.crossOrigin = 'anonymous';

  image.onload = function() {
    flagImage = image;
    draw();
  };

  image.onerror = function() {
    flagImage = null;
    draw();
  };

  image.src =
    'https://flagcdn.com/w40/' +
    code +
    '.png';
}


/* -------------------------------------------------------
   DRAW
------------------------------------------------------- */

function draw() {

  ctx.clearRect(0, 0, 1500, 500);

  ctx.drawImage(
    img,
    0,
    0,
    1500,
    500
  );


  /*
    These coordinates correspond to the current
    1500 × 500 banner.
  */

  const slots = [

    {
      id: 'name',
      x: 1308,
      y: 246,
      max: 120
    },

    {
      id: 'username',
      x: 1308,
      y: 294,
      max: 120
    },

    {
      id: 'location',
      x: 1308,
      y: 342,
      max: 120
    },

    {
      id: 'chapter',
      x: 1308,
      y: 390,
      max: 105
    }

  ];


  /*
    ARC-compatible font.
    Bold and centered inside the value area.
  */

  ctx.fillStyle = '#182b54';

  ctx.textBaseline = 'middle';
  ctx.textAlign = 'center';

  for (const slot of slots) {

    const value =
      document.getElementById(slot.id).value.trim()
      || defaults[slot.id];

    const font =
      '700 15px Inter, Arial, sans-serif';

    const clipped =
      fitText(
        value,
        slot.max,
        font
      );

    ctx.font = font;

    ctx.fillStyle = '#182b54';

    ctx.fillText(
      clipped,
      slot.x,
      slot.y
    );
  }


  /* ---------------------------------------------------
     FLAG
     
     ONLY THIS POSITION HAS BEEN CHANGED.

     Chapter box:
       left  ≈ 1175
       right ≈ 1435

     Flag:
       width  = 24
       right padding = 10

     Therefore the flag ends at x ≈ 1425,
     safely inside the right border.
  --------------------------------------------------- */

  if (flagImage) {

    const flagWidth = 24;
    const flagHeight = 16;

    const chapterBoxRight = 1435;
    const rightPadding = 10;

    const flagX =
      chapterBoxRight -
      rightPadding -
      flagWidth;

    const flagY =
      390 -
      flagHeight / 2;

    ctx.drawImage(
      flagImage,
      flagX,
      flagY,
      flagWidth,
      flagHeight
    );
  }

}


/* -------------------------------------------------------
   EVENTS
------------------------------------------------------- */

img.onload = function() {
  draw();
};


fields.forEach(id => {

  document
    .getElementById(id)
    .addEventListener(
      'input',
      draw
    );

});


flagSelect.addEventListener(
  'change',
  function() {

    loadFlag(this.value);

  }
);


/* -------------------------------------------------------
   DOWNLOAD
------------------------------------------------------- */

document
  .getElementById('download')
  .addEventListener('click', function() {

    try {

      const a =
        document.createElement('a');

      a.download =
        'arc-community-banner-1500x500.png';

      a.href =
        canvas.toDataURL('image/png');

      document.body.appendChild(a);

      a.click();

      document.body.removeChild(a);

    } catch (error) {

      alert(
        'The banner could not be downloaded. Please select the flag again and try once more.'
      );

      console.error(error);

    }

  });


/* -------------------------------------------------------
   RESET
------------------------------------------------------- */

document
  .getElementById('reset')
  .addEventListener('click', function() {

    fields.forEach(id => {

      document
        .getElementById(id)
        .value = defaults[id];

    });

    flagSelect.value = '';

    flagImage = null;
    flagCode = '';

    draw();

  });


/* -------------------------------------------------------
   INITIAL DRAW
------------------------------------------------------- */

if (img.complete) {

}

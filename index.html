<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Arc Community Banner — Customize</title>

<style>
  :root {
    font-family:
      Inter,
      "Segoe UI",
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      sans-serif;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: #f5f6f8;
    color: #182b54;
  }

  .wrap {
    max-width: 1180px;
    margin: 32px auto;
    padding: 0 20px 40px;
  }

  h1 {
    margin: 0 0 6px;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  p {
    margin: 0 0 22px;
    color: #59647a;
    line-height: 1.5;
  }

  .grid {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 24px;
    align-items: start;
  }

  .panel {
    background: #fff;
    border: 1px solid #dfe4ec;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 8px 28px rgba(20,35,60,.06);
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .05em;
    margin: 14px 0 6px;
    color: #182b54;
  }

  input,
  select {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid #cbd3df;
    border-radius: 9px;
    font-size: 14px;
    font-family: inherit;
    background: #fff;
    color: #182b54;
    outline: none;
  }

  input:focus,
  select:focus {
    border-color: #557bd1;
    box-shadow: 0 0 0 3px rgba(85,123,209,.12);
  }

  button {
    width: 100%;
    margin-top: 18px;
    border: 0;
    border-radius: 9px;
    padding: 12px;
    font-family: inherit;
    font-weight: 800;
    cursor: pointer;
  }

  #download {
    background: #172b55;
    color: #fff;
  }

  #download:hover {
    background: #102246;
  }

  #reset {
    background: #edf1f6;
    color: #24324d;
  }

  #reset:hover {
    background: #e1e6ee;
  }

  canvas {
    width: 100%;
    height: auto;
    display: block;
    background: white;
    border-radius: 10px;
    border: 1px solid #dfe4ec;
  }

  .hint {
    font-size: 12px;
    line-height: 1.5;
    margin-top: 14px;
    color: #6a7486;
  }

  .country-preview {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 8px;
    padding: 9px 11px;
    background: #f7f9fc;
    border: 1px solid #e1e6ee;
    border-radius: 9px;
    font-size: 13px;
  }

  .country-preview .flag {
    font-size: 22px;
    line-height: 1;
  }

  .country-preview .country-name {
    font-weight: 700;
    color: #182b54;
  }

  @media(max-width:850px) {
    .grid {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>

<body>

<div class="wrap">

  <h1>Arc Community Banner</h1>

  <p>
    Customize your Arc community banner, then download the final
    1500 × 500 PNG for X / Twitter.
  </p>

  <div class="grid">

    <!-- CONTROL PANEL -->
    <section class="panel">

      <label for="name">NAME</label>
      <input
        id="name"
        type="text"
        value="Ali Çınar"
        maxlength="32"
        autocomplete="off"
      >

      <label for="username">USERNAME</label>
      <input
        id="username"
        type="text"
        value="@malto"
        maxlength="32"
        autocomplete="off"
      >

      <label for="location">LOCATION</label>
      <input
        id="location"
        type="text"
        value="İzmir"
        maxlength="28"
        autocomplete="off"
      >

      <label for="chapter">CHAPTER</label>
      <input
        id="chapter"
        type="text"
        value="Türkiye"
        maxlength="28"
        autocomplete="off"
      >

      <label for="country">COUNTRY</label>

      <select id="country"></select>

      <div class="country-preview">
        <span class="flag" id="flagPreview">🇹🇷</span>
        <span class="country-name" id="countryNamePreview">
          Türkiye
        </span>
      </div>

      <button id="download">
        DOWNLOAD 1500 × 500 PNG
      </button>

      <button id="reset">
        RESET
      </button>

      <div class="hint">
        Your name, username, location and chapter are placed directly
        inside the four profile fields of the banner.
        The selected country is displayed as a flag next to the chapter.
      </div>

    </section>


    <!-- BANNER PREVIEW -->
    <section class="panel">
      <canvas
        id="canvas"
        width="1500"
        height="500"
      ></canvas>
    </section>

  </div>

</div>

/* =========================================================
   COUNTRY SELECT
========================================================= */

function countryCodeToFlag(code) {

  const normalized = code.trim().toUpperCase();

  if (!/^[A-Z]{2}$/.test(normalized)) {
    return "";
  }

  return [...normalized]
    .map(char =>
      String.fromCodePoint(
        127397 + char.charCodeAt(0)
      )
    )
    .join("");
}


function populateCountries() {

  const sortedCodes = [...countryCodes].sort((a, b) => {

    const nameA = countryNames[a] || a;
    const nameB = countryNames[b] || b;

    return nameA.localeCompare(
      nameB,
      undefined,
      { sensitivity: "base" }
    );
  });

  countrySelect.innerHTML = "";

  for (const code of sortedCodes) {

    const option = document.createElement("option");

    option.value = code;

    option.textContent =
      `${countryCodeToFlag(code)} ${countryNames[code] || code}`;

    countrySelect.appendChild(option);
  }

  countrySelect.value = "TR";

  updateCountryPreview();
}


/* =========================================================
   COUNTRY PREVIEW
========================================================= */

function updateCountryPreview() {

  const code = countrySelect.value;

  const flag = countryCodeToFlag(code);

  const name =
    countryNames[code] ||
    code;

  flagPreview.textContent = flag;

  countryNamePreview.textContent =
    `${name} (${code})`;

  draw();
}


/* =========================================================
   TEXT FITTING
========================================================= */

function fitText(
  text,
  maxWidth,
  font,
  minimumSize = 10
) {

  let size = parseInt(
    font.match(/\d+/)?.[0] || "18",
    10
  );

  const family =
    '"Segoe UI", Inter, system-ui, sans-serif';

  while (size > minimumSize) {

    ctx.font =
      `800 ${size}px ${family}`;

    if (
      ctx.measureText(text).width <= maxWidth
    ) {
      return {
        text,
        font:
          `800 ${size}px ${family}`
      };
    }

    size--;
  }

  ctx.font =
    `800 ${minimumSize}px ${family}`;

  let result = text;

  while (
    result.length > 3 &&
    ctx.measureText(result + "…").width > maxWidth
  ) {

    result =
      result.slice(0, -1);
  }

  return {
    text: result + "…",
    font:
      `800 ${minimumSize}px ${family}`
  };
}


/* =========================================================
   DRAW VALUE
========================================================= */

function drawValue({
  text,
  x,
  y,
  maxWidth,
  size = 18
}) {

  const family =
    '"Segoe UI", Inter, system-ui, sans-serif';

  const fitted =
    fitText(
      text,
      maxWidth,
      `800 ${size}px ${family}`,
      10
    );

  ctx.font = fitted.font;

  ctx.fillStyle = "#182b54";

  ctx.textAlign = "left";

  ctx.textBaseline = "middle";

  ctx.fillText(
    fitted.text,
    x,
    y
  );
}


/* =========================================================
   DRAW CHAPTER + FLAG
========================================================= */

function drawChapter(
  chapter,
  countryCode,
  x,
  y,
  maxWidth
) {

  const flag =
    countryCodeToFlag(countryCode);

  const family =
    '"Segoe UI", Inter, system-ui, sans-serif';

  const flagFont =
    `800 17px ${family}`;

  const textFont =
    `800 17px ${family}`;

  /*
    Flag area.
  */

  const flagWidth = 27;

  /*
    Chapter text receives the remaining width.
  */

  const availableWidth =
    maxWidth - flagWidth;

  const fitted =
    fitText(
      chapter,
      availableWidth,
      textFont,
      10
    );

  /*
    Chapter text.
  */

  ctx.font = fitted.font;

  ctx.fillStyle =
    "#182b54";

  ctx.textAlign =
    "left";

  ctx.textBaseline =
    "middle";

  ctx.fillText(
    fitted.text,
    x,
    y
  );

  /*
    Flag.
  */

  ctx.font =
    flagFont;

  const textWidth =
    ctx.measureText(fitted.text).width;

  ctx.fillText(
    flag,
    x + textWidth + 8,
    y
  );
}


/* =========================================================
   MAIN DRAW
========================================================= */

function draw() {

  if (!img.complete) {
    return;
  }

  ctx.clearRect(
    0,
    0,
    WIDTH,
    HEIGHT
  );

  /*
    Draw original banner.
    IMPORTANT:
    Do NOT resize or distort the image.
    It is already 1500 × 500.
  */

  ctx.drawImage(
    img,
    0,
    0,
    WIDTH,
    HEIGHT
  );


  /* =======================================================
     VALUE AREAS
     
     These coordinates correspond to the current
     1500 × 500 banner.
  ======================================================= */

  const valueArea = {
    x: 1308,
    maxWidth: 118
  };


  /* =======================================================
     WHITE VALUE AREAS
     
     Only erase the placeholder/value part.
     Labels and icons remain untouched.
  ======================================================= */

  ctx.fillStyle = "#ffffff";

  /*
    NAME
  */

  ctx.fillRect(
    1300,
    230,
    125,
    28
  );

  /*
    USERNAME
  */

  ctx.fillRect(
    1300,
    272,
    125,
    28
  );

  /*
    LOCATION
  */

  ctx.fillRect(
    1300,
    314,
    125,
    28
  );

  /*
    CHAPTER
  */

  ctx.fillRect(
    1300,
    356,
    125,
    28
  );


  /* =======================================================
     VALUES
  ======================================================= */

  const name =
    nameInput.value.trim() ||
    "YOUR NAME";

  const username =
    usernameInput.value.trim() ||
    "@YOUR_USERNAME";

  const location =
    locationInput.value.trim() ||
    "YOUR CITY";

  const chapter =
    chapterInput.value.trim() ||
    "YOUR CHAPTER";

  const country =
    countrySelect.value ||
    "TR";


  /* =======================================================
     NAME
  ======================================================= */

  drawValue({
    text: name,
    x: valueArea.x,
    y: 244,
    maxWidth: valueArea.maxWidth,
    size: 17
  });


  /* =======================================================
     USERNAME
  ======================================================= */

  drawValue({
    text: username,
    x: valueArea.x,
    y: 286,
    maxWidth: valueArea.maxWidth,
    size: 17
  });


  /* =======================================================
     LOCATION
  ======================================================= */

  drawValue({
    text: location,
    x: valueArea.x,
    y: 328,
    maxWidth: valueArea.maxWidth,
    size: 17
  });


  /* =======================================================
     CHAPTER + FLAG
  ======================================================= */

  drawChapter(
    chapter,
    country,
    valueArea.x,
    370,
    valueArea.maxWidth
  );
}


/* =========================================================
   IMAGE LOAD
========================================================= */

img.onload = function() {
  draw();
};


/* =========================================================
   LIVE INPUT
========================================================= */

nameInput.addEventListener(
  "input",
  draw
);

usernameInput.addEventListener(
  "input",
  draw
);

locationInput.addEventListener(
  "input",
  draw
);

chapterInput.addEventListener(
  "input",
  draw
);

countrySelect.addEventListener(
  "change",
  updateCountryPreview
);


/* =========================================================
   DOWNLOAD
========================================================= */

document
  .getElementById("download")
  .addEventListener("click", () => {

    const link =
      document.createElement("a");

    link.download =
      "arc-community-banner-1500x500.png";

    link.href =
      canvas.toDataURL(
        "image/png",
        1.0
      );

    link.click();
  });


/* =========================================================
   RESET
========================================================= */

document
  .getElementById("reset")
  .addEventListener("click", () => {

    nameInput.value =
      "Ali Çınar";

    usernameInput.value =
      "@malto";

    locationInput.value =
      "İzmir";

    chapterInput.value =
      "Türkiye";

    countrySelect.value =
      "TR";

    updateCountryPreview();

    draw();
  });


/* =========================================================
   INITIALIZE
========================================================= */

populateCountries();

</script>
